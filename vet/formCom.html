<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valora tu clínica veterinaria</title>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Valora tu clínica veterinaria</h1>
      <p>Tu reseña ayuda a otros dueños a comparar precios y servicios.</p>
      <p class="aviso">
        Los campos con <span class="obligatorio">*</span> son obligatorios.
      </p>

      <form action="">
        <ol>
          <li>
            <label for="nombreCl"
              >Nombre de la clínica
              <span class="obligatorio" aria-hidden="true">*</span></label
            >
            <input type="text" id="nombreCl" name="nombreCl" required />
          </li>
          <li>
            <label for="servicio"
              >Servicio que contrataste
              <span class="obligatorio" aria-hidden="true">*</span></label
            >
            <select id="servicio" name="servicio" required>
              <option value="">Elige un servicio</option>
              <option value="peluqueria">Peluquería</option>
              <option value="vacunas">Vacunas</option>
              <option value="productos">Productos</option>
            </select>
          </li>
          <li>
            <label for="precio"
              >Precio que pagaste (€)
              <span class="obligatorio" aria-hidden="true">*</span></label
            >
            <input
              type="number"
              id="precio"
              name="precio"
              min="0"
              step="0.01"
              required
              aria-describedby="precioAyuda"
            />
            <p class="ayuda" id="precioAyuda">El total con IVA, por ejemplo 35,50.</p>
          </li>
          <li>
            <label for="calificacion"
              >Puntuación del 0 al 10
              <span class="obligatorio" aria-hidden="true">*</span></label
            >
            <input
              type="number"
              id="calificacion"
              name="calificacion"
              min="0"
              max="10"
              required
            />
          </li>
          <li>
            <label for="mascota"
              >Nombre de tu mascota <span class="opcional">(opcional)</span></label
            >
            <input type="text" id="mascota" name="mascota" />
          </li>
          <li>
            <label for="raza">Raza <span class="opcional">(opcional)</span></label>
            <input type="text" id="raza" name="raza" />
          </li>
          <li>
            <fieldset>
              <legend>Edad <span class="opcional">(opcional)</span></legend>
              <label class="opcion"
                ><input type="radio" name="tipoMascota" value="adulto" />
                Adulto</label
              >
              <label class="opcion"
                ><input type="radio" name="tipoMascota" value="cachorro" />
                Cachorro</label
              >
            </fieldset>
          </li>
          <li>
            <label for="comentarios"
              >Comentarios <span class="opcional">(opcional)</span></label
            >
            <textarea id="comentarios" name="comentarios" rows="4"></textarea>
          </li>
          <li>
            <label class="opcion"
              ><input type="checkbox" name="recomendable" value="si" />
              Recomendaría esta clínica
              <span class="opcional">(opcional)</span></label
            >
          </li>
        </ol>

        <div class="acciones">
          <button type="submit" class="primario">Publicar reseña</button>
          <button type="reset" class="secundario">Cancelar</button>
        </div>
      </form>
    </main>
  </body>
</html>
